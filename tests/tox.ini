[tox]
envlist = all
skipsdist = true

[testenv]
description = run every test, including the ones that boot the OS, in parallel (about a minute)
deps =
    pytest>=7
    pytest-xdist>=3
passenv =
    APRICOSASM_JAR
    APRSIM
    APRICOSFSMAN
    JAVA
    HOME
    TERM
commands = pytest -n auto --dist loadgroup {posargs}

[testenv:all]

[testenv:fast]
description = run only the tests that don't boot the OS (seconds)
commands = pytest -m "not simulator" {posargs}

[pytest]
testpaths = .
addopts = -ra
python_files = test_*.py
