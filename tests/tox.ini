[tox]
envlist = all
skipsdist = true

[testenv]
description = run every test, including the ones that boot the OS (several minutes)
deps = pytest>=7
passenv =
    APRICOSASM_JAR
    APRSIM
    APRICOSFSMAN
    JAVA
    HOME
    TERM
commands = pytest {posargs}

[testenv:all]

[testenv:fast]
description = run only the tests that don't boot the OS (seconds)
commands = pytest -m "not simulator" {posargs}

[pytest]
testpaths = .
addopts = -ra
python_files = test_*.py
